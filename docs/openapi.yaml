openapi: 3.0.3
info:
  title: Pill dispenser API
  version: 0.3.0
  description: |
    REST API of the modular carousel pill dispenser (firmware 0.3.0).
    Base URL: http://pilldispenser.local/api/v1 (mDNS service `_pilldispenser._tcp`, TXT `api=/api/v1`).

    Sync model for an app:
    1. Push the medication plan as schedules (`/schedules`) or call `/dispense` yourself at dose time.
    2. Read back what really happened: poll `/events?since=<last_seq>` or set `webhook_url` in `/settings`
       and receive the same events as HTTP POST.
    3. Keep stock in step with `/slots` (the device decrements `count` for every pill its drop sensor sees).

    Slots are numbered 1..10 as engraved on the carousel.

    Two people can share the dispenser: schedules, jobs and events carry a profile (1 or 2), a slot can be reserved
    for one profile, and each profile has its own button (profile 1 right, profile 2 left).
servers:
  - url: http://pilldispenser.local/api/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "Only enforced when api_key is set in the settings. The header 'X-API-Key' works too."
  schemas:
    Error:
      type: object
      properties: { error: { type: string } }
    Item:
      type: object
      required: [slot]
      properties:
        slot: { type: integer, minimum: 1, maximum: 10 }
        count: { type: integer, minimum: 1, default: 1, description: "Upper bound: setting max_per_item (default 12)" }
        dispensed: { type: integer, readOnly: true, description: Pills the drop sensor counted }
        missed: { type: integer, readOnly: true, description: Pills that did not come out (empty / jammed) }
    Job:
      type: object
      properties:
        id: { type: integer }
        state: { type: string, enum: [queued, running, done, partial, failed, cancelled] }
        source: { type: string, enum: [api, schedule, button] }
        profile: { type: integer, enum: [1, 2], description: Whose pills }
        request_id: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/Item' } }
        error: { type: string }
        created: { type: integer, description: Unix time, 0 if the clock is not set }
        finished: { type: integer }
    Slot:
      type: object
      properties:
        slot: { type: integer, readOnly: true }
        name: { type: string, maxLength: 31 }
        roller: { type: string, maxLength: 15, description: Free text, e.g. XL_soft }
        count: { type: integer, description: Pills left, -1 = not tracked }
        low: { type: integer, description: Low-stock threshold }
        enabled: { type: boolean }
        profile: { type: integer, enum: [0, 1, 2], default: 0, description: "0 = shared. 1 or 2 = reserved: only doses of that profile may use the slot. Refused (409) while a schedule of the other profile uses it." }
        low_stock: { type: boolean, readOnly: true }
    Schedule:
      type: object
      required: [time, items]
      properties:
        id: { type: integer, readOnly: true }
        time: { type: string, example: "08:00", description: Local time HH:MM (time zone = setting tz) }
        days: { type: array, items: { type: integer, minimum: 1, maximum: 7 }, description: "1 = Monday ... 7 = Sunday, default all" }
        enabled: { type: boolean, default: true }
        mode:
          type: string
          enum: [auto, confirm]
          default: auto
          description: >
            auto = dispense at that time, unless the pills that went into the cup last were for the other profile: then
            the dose waits like a confirm dose (dose_due, message ending in "cup may hold other pills"), so that two
            people's pills never share the cup unseen. confirm = raise a dose_due event and wait for the button of the
            schedule's profile or POST /schedules/{id}/run.
        profile:
          type: integer
          enum: [1, 2]
          default: 1
          description: Whose dose. Profile 1's button is on the right, profile 2's on the left. Every slot of the schedule must be shared or reserved for this profile (400 otherwise).
        label: { type: string, maxLength: 23 }
        items: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/Item' } }
        last_run: { type: integer, readOnly: true, description: yyyymmdd of the last run }
    Event:
      type: object
      properties:
        seq: { type: integer, description: Strictly increasing; resets to 0 on reboot }
        time: { type: integer }
        type:
          type: string
          description: >
            boot, homed, resync, moved, job_started, job_done, job_partial, job_failed, slot_empty, double, low_stock,
            chute_blocked, dose_due, dose_started, dose_missed, button, stop, error. button = a button was pressed while
            no dose of its profile was due.
            Every arrival at a slot is checked against that slot's index flag. resync = the arrival did not match:
            either the position was corrected (message "slot reached N steps off, corrected") or the carousel homes
            again (message ends in "homing again"); no stroke happens until the slot is confirmed. moved = the index
            light barrier changed while the carousel stood still (turned by hand): it homes before the next move.
        message: { type: string }
        slot: { type: integer }
        job_id: { type: integer }
        profile: { type: integer, description: 1 or 2 if the event concerns one profile's dose or job }
paths:
  /status:
    get:
      summary: Device state
      responses:
        '200':
          description: >
            state is one of boot, idle, homing, moving, dispensing, error. due lists the schedules waiting for a button,
            due_doses the same with their profile and since when; cup_profile is the profile whose pills went into the
            cup last (0 = none yet).
          content:
            application/json:
              example: { device: pilldispenser, firmware: 0.3.0, state: idle, homed: true, slot_at_station: 3, position_confirmed: true, current_job: 0, error: "", slots: 10, time: 1794400000, uptime_s: 532, last_event_seq: 17, due: [4], due_doses: [ { schedule: 4, profile: 2, since: 1794399700 } ], cup_profile: 1, wifi: { ssid: home, ip: 192.168.1.50, rssi: -58 } }
  /slots:
    get:
      summary: All slots
      responses: { '200': { description: "{ slots: [Slot] }" } }
  /slots/{slot}:
    parameters: [ { name: slot, in: path, required: true, schema: { type: integer } } ]
    get: { summary: One slot, responses: { '200': { description: Slot } } }
    put:
      summary: Name a slot, set its stock after refilling, enable / disable it
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Slot' }, example: { name: "Magnesium 400", roller: L_cap00, count: 60, low: 8, profile: 2 } } } }
      responses: { '200': { description: Slot }, '409': { description: A schedule of the other profile uses this slot } }
  /dispense:
    post:
      summary: Dispense now
      description: >
        Queues a job and returns at once (202). Poll /jobs/{id} or wait for the job_done / job_partial / job_failed event.
        Send a unique request_id: repeating a request with the same id returns the existing job (200) instead of dispensing twice.
        profile (1 or 2) says whose pills they are; without it, the owner of the reserved slots, or 1 if all are shared.
      requestBody:
        content:
          application/json:
            example: { request_id: "7c1e-morning-2026-11-12", profile: 1, items: [ { slot: 1, count: 1 }, { slot: 5, count: 2 } ] }
      responses:
        '202': { description: Job queued, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '200': { description: Same request_id seen before - existing job returned }
        '400': { description: Bad request (slot / count out of range, slot disabled, slot reserved for the other profile) }
        '503': { description: Job queue full }
  /jobs:
    get: { summary: Recent jobs (newest first, kept in RAM), responses: { '200': { description: "{ jobs: [Job] }" } } }
  /jobs/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
    get: { summary: One job with per-item progress, responses: { '200': { description: Job }, '404': { description: Unknown job } } }
  /jobs/{id}/cancel:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
    post: { summary: Cancel a queued job, responses: { '200': { description: Job }, '409': { description: Job already running or finished } } }
  /stop:
    post: { summary: Stop the running job and cancel everything queued, responses: { '200': { description: ok } } }
  /events:
    get:
      summary: Event log (ring buffer of 48)
      parameters:
        - { name: since, in: query, schema: { type: integer }, description: Return events with seq greater than this }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { '200': { description: "{ events: [Event], last_seq }" } }
  /schedules:
    get: { summary: All schedules, responses: { '200': { description: "{ schedules: [Schedule] }" } } }
    post:
      summary: Add a schedule (max 16)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' }, example: { time: "07:30", days: [1, 2, 3, 4, 5], mode: confirm, profile: 1, label: morning, items: [ { slot: 1, count: 1 }, { slot: 2, count: 1 } ] } } } }
      responses: { '201': { description: Schedule } }
  /schedules/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
    put: { summary: Change a schedule (send only the fields to change), responses: { '200': { description: Schedule } } }
    delete: { summary: Delete a schedule, responses: { '200': { description: ok } } }
  /schedules/{id}/run:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer } } ]
    post: { summary: Dispense this schedule now (also confirms a due dose), responses: { '202': { description: Job }, '409': { description: A slot of the schedule is reserved for the other profile now - nothing dispensed } } }
  /present:
    post:
      summary: Turn a slot to the refill position
      requestBody: { content: { application/json: { example: { slot: 4 } } } }
      responses: { '200': { description: ok }, '503': { description: Busy } }
  /goto:
    post: { summary: Turn a slot to the station without dispensing, responses: { '200': { description: ok } } }
  /home:
    post: { summary: Home the carousel, responses: { '200': { description: ok } } }
  /settings:
    get: { summary: Settings (secrets are not returned), responses: { '200': { description: Settings object } } }
    put:
      summary: Change settings (partial)
      description: >
        hostname, api_key, tz (POSIX TZ string), webhook_url, car_dir (1 / -1), home_offset, backlash, step_us_cruise,
        step_us_start, accel_steps, servo_park_us, servo_end_us, servo_over_us, servo_dps, rock_deg, beam_required,
        retries, max_per_item, refill_slots, due_timeout_min, rehome_jobs, buzzer, profile_names (two names of up to 15
        characters, e.g. ["Anna", "Ben"]; null keeps a name).
      responses: { '200': { description: Settings object } }
  /diag:
    get: { summary: "Sensor self-test and raw values for setup. beam_ok is true when the receiver in the chute follows its emitter being switched off and on; beam_level_lit / beam_level_dark are the two levels found; home_level is the raw level of the index light barrier under the carousel, home_active whether a flag is in it, flag_level the level a flag gives (found by homing); index_flags_deg the ten flag widths measured by the last homing, slot 1 first (about 24-27, then about 12-15 each: the beam has a width, so a flag reads a little wider than it is); position_confirmed whether the slot at the station was confirmed by its flag; also servo_us, position_steps, steps_per_slot.", responses: { '200': { description: Diagnostics } } }
  /jog:
    post: { summary: Calibration - move the carousel by raw half-steps, requestBody: { content: { application/json: { example: { steps: 40 } } } }, responses: { '200': { description: ok } } }
  /servo:
    post: { summary: Calibration - move the servo, requestBody: { content: { application/json: { example: { position: park } } } }, responses: { '200': { description: ok } } }
  /park:
    post: { summary: Return the roller drive to the pocket-up position, responses: { '200': { description: ok } } }
  /calibrate/slot1:
    post:
      summary: Calibration - declare that slot 1 is exactly at the station now
      description: Home first, then jog slot 1 to the station. Refused when slot 1's index flag is not in the light barrier at this position (station closer than 2 degrees to an edge of the flag, or a different slot at the station).
      responses: { '200': { description: "{ home_offset }" }, '409': { description: "Not homed, busy, or slot 1's flag is not in the light barrier here" } }
  /wifi:
    post: { summary: Store Wi-Fi credentials and restart, requestBody: { content: { application/json: { example: { ssid: home, password: secret } } } }, responses: { '200': { description: ok } } }
  /reboot:
    post: { summary: Restart, responses: { '200': { description: ok } } }
