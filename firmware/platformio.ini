; PlatformIO project for the pill dispenser firmware.
; The sketch folder also opens directly in the Arduino IDE (File > Open > pilldispenser.ino).
[platformio]
src_dir = pilldispenser
default_envs = xiao_esp32c6

[env]
; pioarduino = community platform that ships the Arduino-ESP32 core 3.x (needed for the ESP32-C6)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_esp32c6]
board = seeed_xiao_esp32c6

[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
